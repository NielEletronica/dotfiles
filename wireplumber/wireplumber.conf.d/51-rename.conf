monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi*" }
    ]
    actions = {
      update-props = {
        node.description = "tv"
        node.nick = "tv"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*analog*" }
    ]
    actions = {
      update-props = {
        node.description = "fone"
        node.nick = "fone"
      }
    }
  }
]
